services:
  postgres:
    image: postgres:16-alpine
    container_name: editor-video-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: editor
      POSTGRES_PASSWORD: editor
      POSTGRES_DB: editor_video
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U editor -d editor_video"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: editor-video-redis
    restart: unless-stopped
    ports:
      - "56379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
