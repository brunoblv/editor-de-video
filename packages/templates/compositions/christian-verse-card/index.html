<!doctype html>
<html
  lang="pt-BR"
  data-composition-variables='[
    {"id":"text","type":"string","label":"Texto do versículo (biblioteca local)","default":"O Senhor é o meu pastor; nada me faltará.","maxLength":600},
    {"id":"reference","type":"string","label":"Referência","default":"Salmos 23:1","maxLength":60},
    {"id":"translation","type":"string","label":"Tradução","default":"ARC","maxLength":20},
    {"id":"lightLevel","type":"number","label":"Nível de luz","default":0.4,"min":0,"max":1,"step":0.05},
    {"id":"accent","type":"color","label":"Destaque","default":"#E8B65A"},
    {"id":"background","type":"color","label":"Fundo","default":"#120E0A"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__WIDTH__, height=__HEIGHT__" />
    <title>Versículo</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: var(--background); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--background); }
      #glow { position: absolute; inset: -20%; background: radial-gradient(circle at 50% 30%, var(--accent), transparent 55%); opacity: calc(var(--lightLevel) * 0.55); }
      .clip { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 10%; box-sizing: border-box; text-align: center; }
      #text { margin: 0; color: #FFF8EC; font-family: Lora, Georgia, serif; font-size: min(5.2vw, 6vh); line-height: 1.35; }
      #reference { margin: 4vh 0 0; color: var(--accent); font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: min(3vw, 3.4vh); letter-spacing: 0.06em; }
      #translation { margin: 1vh 0 0; color: rgba(255, 248, 236, 0.6); font-family: Inter, system-ui, sans-serif; font-size: min(2vw, 2.2vh); letter-spacing: 0.2em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="__WIDTH__" data-height="__HEIGHT__" data-duration="__DURATION__">
      <div id="glow"></div>
      <section id="verse" class="clip" data-start="0" data-duration="__DURATION__">
        <p id="text" data-var-text="text">O Senhor é o meu pastor; nada me faltará.</p>
        <p id="reference" data-var-text="reference">Salmos 23:1</p>
        <p id="translation" data-var-text="translation">ARC</p>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from('#glow', { opacity: 0, duration: 2, ease: 'sine.inOut' }, 0)
        .from('#text', { opacity: 0, y: 30, duration: 1.4, ease: 'power2.out' }, 0.4)
        .from(['#reference', '#translation'], { opacity: 0, duration: 1, stagger: 0.2, ease: 'power1.out' }, 1.4);
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
